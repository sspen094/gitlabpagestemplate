# GitLab Duo external agent — product manager (requirements authoring)
# Copy to the PRODUCT repo: .gitlab/duo/flows/pm-agent.yaml
# Enable in project: Settings → GitLab Duo → Agents (or AI Catalog on GitLab.com)
#
# Prerequisites: external agents enabled; service account with api + write_repository + ai_features
# Set CI/CD variable ADDITIONAL_INSTRUCTIONS (see project-connection.md)

injectGatewayToken: true
image: node:22-slim
commands:
  - echo "Installing codex"
  - npm install --global @openai/codex
  - echo "Installing glab"
  - export OPENAI_API_KEY=$AI_FLOW_AI_GATEWAY_TOKEN
  - apt-get update --quiet && apt-get install --yes curl wget gpg git && rm --recursive --force /var/lib/apt/lists/*
  - curl --silent --show-error --location "https://raw.githubusercontent.com/upciti/wakemeops/main/assets/install_repository" | bash
  - apt-get install --yes glab
  - mkdir -p ~/.config/glab-cli
  - |
    cat > ~/.config/glab-cli/config.yml <<EOF
    hosts:
      $AI_FLOW_GITLAB_HOSTNAME:
        token: $AI_FLOW_GITLAB_TOKEN
        is_oauth2: "true"
        client_id: "bypass"
        oauth2_refresh_token: ""
        oauth2_expiry_date: "01 Jan 50 00:00 UTC"
        api_host: $AI_FLOW_GITLAB_HOSTNAME
        user: PM-Codex
    check_update: "false"
    git_protocol: https
    EOF
  - chmod 600 ~/.config/glab-cli/config.yml
  - git config --global user.email "pm-codex@gitlab.com"
  - git config --global user.name "PM Codex Agent"
  - git remote set-url origin https://gitlab-ci-token:$AI_FLOW_GITLAB_TOKEN@$AI_FLOW_GITLAB_HOSTNAME/$AI_FLOW_PROJECT_PATH.git
  - |
    header_str="{"
    first=true
    while IFS= read -r line; do
      [ -z "$line" ] && continue
      key="${line%%:*}"
      value="${line#*: }"
      if [ "$first" = true ]; then first=false; else header_str+=", "; fi
      header_str+="'$key' = '$value'"
    done <<< "$AI_FLOW_AI_GATEWAY_HEADERS"
    header_str+="}"
    codex exec \
      --config 'model="gpt-5.1-codex"' \
      --config 'model_provider="gitlab"' \
      --config 'model_providers.gitlab.name="GitLab Managed Codex"' \
      --config 'model_providers.gitlab.base_url="https://cloud.gitlab.com/ai/v1/proxy/openai/v1"' \
      --config 'model_providers.gitlab.env_key="OPENAI_API_KEY"' \
      --config 'model_providers.gitlab.wire_api="responses"' \
      --config "model_providers.gitlab.http_headers=${header_str}" \
      --config shell_environment_policy.ignore_default_excludes=true \
      --dangerously-bypass-approvals-and-sandbox "
    You are the senior product manager agent for this GitLab project.

    Read docs/product-manager-agent/AGENTS.md and implementation-catalog.md first every session.
    Follow all playbooks in docs/product-manager-agent/.

    Context: $AI_FLOW_CONTEXT
    Task: $AI_FLOW_INPUT
    Event: $AI_FLOW_EVENT

    Default scope: draft or update slice requirements under docs/requirements/ only.
    Do not modify src/, tests/, database/, or CI unless the human explicitly requests it.
    Keep Status: Draft until a human approves business intent.

    Use glab for GitLab reads. When saving requirements, use branch feature/pm-<short-topic>, commit, push, and open an MR if one does not exist.

    $ADDITIONAL_INSTRUCTIONS
    "
variables:
  - ADDITIONAL_INSTRUCTIONS
