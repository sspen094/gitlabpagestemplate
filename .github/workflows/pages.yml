name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Project sites are served from /<repo>/, user/org sites from /.
      - name: Resolve base path
        id: base
        env:
          BASE_URL_OVERRIDE: ${{ vars.BASE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$BASE_URL_OVERRIDE" ]; then
            base="$BASE_URL_OVERRIDE"
          elif [ "$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')" = "$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io" ]; then
            base="/"
          else
            base="/$REPO_NAME/"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Vite base: $base"

      - name: Build
        run: npm run build
        env:
          BASE_URL: ${{ steps.base.outputs.base }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
