name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Vite inlines VITE_* at build time, so this job must join the environment
    # that holds the sheet configuration. Deployment still happens in `deploy`.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Project sites are served from /<repo>/, user/org sites from /.
      - name: Resolve base path
        id: base
        env:
          BASE_URL_OVERRIDE: ${{ vars.BASE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$BASE_URL_OVERRIDE" ]; then
            base="$BASE_URL_OVERRIDE"
          elif [ "$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')" = "$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io" ]; then
            base="/"
          else
            base="/$REPO_NAME/"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Vite base: $base"

      # Both values are public and non-secret. An empty value here is the one
      # failure that looks like success: the build passes and every updatable
      # module silently renders its static shell.
      - name: Check sheet config
        env:
          SHEETS_URL: ${{ vars.VITE_GOOGLE_SHEETS_URL }}
          SHEETS_GIDS: ${{ vars.VITE_GOOGLE_SHEETS_GIDS }}
        run: |
          echo "VITE_GOOGLE_SHEETS_URL characters: ${#SHEETS_URL}"
          echo "VITE_GOOGLE_SHEETS_GIDS characters: ${#SHEETS_GIDS}"
          if [ -z "$SHEETS_URL" ] || [ -z "$SHEETS_GIDS" ]; then
            echo "::warning::Sheet config empty; updatable modules will render their static shell. Set VITE_GOOGLE_SHEETS_URL and VITE_GOOGLE_SHEETS_GIDS as github-pages environment variables or repository Actions variables."
          fi

      - name: Build
        run: npm run build
        env:
          BASE_URL: ${{ steps.base.outputs.base }}
          VITE_GOOGLE_SHEETS_URL: ${{ vars.VITE_GOOGLE_SHEETS_URL }}
          VITE_GOOGLE_SHEETS_GIDS: ${{ vars.VITE_GOOGLE_SHEETS_GIDS }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
